name: Docker Build & Docker Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: self-hosted  

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Get commit hash
        id: vars
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Print environment
        run: printenv | sort
        
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          echo "Building image: ${{ secrets.DOCKER_USERNAME }}/mmostore:${SHORT_SHA}"
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mmostore:${SHORT_SHA} \
                       -t ${{ secrets.DOCKER_USERNAME }}/mmostore:latest .


      - name: Stop old container
        run: |
          if [ "$(docker ps -a -q -f name=mmostore)" ]; then
            docker stop mmostore
            docker rm mmostore
          fi
          
      - name: Create temp env file
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env.docker
          echo "DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}" >> .env.docker
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env.docker
          
      - name: Print raw env file
        run: cat .env.docker
        
      - name: Run Docker container
        run: |
          docker run -d --env-file .env.docker --name mmostore -p 80:8080 ${{ secrets.DOCKER_USERNAME }}/mmostore:${SHORT_SHA}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mmostore:${SHORT_SHA}
          docker push ${{ secrets.DOCKER_USERNAME }}/mmostore:latest
