name: Docker Build & Docker Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: self-hosted  

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Get commit hash
        id: vars
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Print environment
        run: printenv | sort
        
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          echo "Building image: ${{ secrets.DOCKER_USERNAME }}/mmostore:${SHORT_SHA}"
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mmostore:${SHORT_SHA} \
                       -t ${{ secrets.DOCKER_USERNAME }}/mmostore:latest .


      - name: Stop old container
        run: |
          if [ "$(docker ps -q -f name=mmostore)" ]; then
            docker stop mmostore
            docker rm mmostore
          fi
          

      - name: Run Docker container
        run: |
          docker run -d --name mmostore -p 80:8080 mmostore:${SHORT_SHA}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mmostore:${SHORT_SHA}
          docker push ${{ secrets.DOCKER_USERNAME }}/mmostore:latest
