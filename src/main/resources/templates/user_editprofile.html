<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section}, ~{::#css}, ~{::#js})}">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa hồ sơ</title>
    <th:block id="css"></th:block>
</head>
<body>
<section>
    <div class="container mt-5 p-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow p-4 mb-5 bg-body rounded">
                    <div class="card-header text-center bg-primary text-white">
                        <h4>Chỉnh sửa hồ sơ</h4>
                    </div>

                    <div class="card-body">
                        <form th:action="@{/user/update}" th:object="${user}" method="post">
                            <div class="mb-3">
                                <label class="form-label"><strong>Họ và tên:</strong></label>
                                <input type="text" th:field="*{name}" class="form-control" placeholder="Nhập họ và tên của bạn" required>
                                <div th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"><strong>Số điện thoại:</strong></label>
                                <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="Nhập số điện thoại" required>
                                <div th:if="${#fields.hasErrors('phoneNumber')}" class="text-danger" th:errors="*{phoneNumber}"></div>
                            </div>

                            <button type="submit" class="btn btn-primary">Cập nhật</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<th:block id="js"></th:block>
</body>
</html>
