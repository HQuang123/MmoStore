<div th:fragment="confirmModal">
    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Xác nhận đặt hàng</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p>Bạn có chắc chắn muốn đặt hàng với tổng tiền <span id="totalValue"></span> không?</p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Không</button>
                    <button id="confirmOrderBtn" type="button" class="btn btn-success">Có</button>
                </div>
            </div>
        </div>
    </div>
</div>
