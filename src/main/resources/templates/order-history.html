<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lịch sử đơn hàng</title>

    <th:block th:fragment="cssFragment">
        <link rel="stylesheet" href="/css/order-history.css">
    </th:block>

    <th:block th:fragment="jsFragment">
        <script src="/javascript/order-history.js"></script>
    </th:block>
</head>
<body>

<section class="container-fluid order-history-page">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <h2 class="page-title">📦 Order History</h2>

            <!-- Filter Section -->
            <div class="filter-container">
                <form class="filter-form" method="get" action="/user/orders">
                    <div>
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="">-- All Status --</option>
                            <option th:each="st : ${statuses}"
                                    th:value="${st.name()}"
                                    th:text="${st.name()}"
                                    th:selected="${st.name() == selectedStatus}">
                            </option>
                        </select>
                    </div>

                    <div>
                        <label class="form-label">Min Total</label>
                        <input type="text" id="minTotal" class="form-control" name="minTotal"
                               th:value="${param.minTotal}" placeholder="e.g. 1,000,000">
                    </div>

                    <div>
                        <label class="form-label">Max Total</label>
                        <input type="text" id="maxTotal" class="form-control" name="maxTotal"
                               th:value="${param.maxTotal}" placeholder="e.g. 10,000,000">
                    </div>

                    <div>
                        <label class="form-label">From Date</label>
                        <input type="date" name="startDate" th:value="${param.startDate}">
                    </div>

                    <div>
                        <label class="form-label">To Date</label>
                        <input type="date" name="endDate" th:value="${param.endDate}">
                    </div>

                    <div class="d-flex gap-2 align-items-end">
                        <button type="submit" class="btn btn-secondary filter-btn">
                            <i class="bi bi-funnel"></i> Filter
                        </button>
                        <a href="/user/orders" class="btn btn-outline-danger">
                            <i class="bi bi-x-circle"></i> Clear
                        </a>
                    </div>
                </form>
            </div>

            <!-- Search -->
            <form th:action="@{/user/orders}" method="get" class="mb-3">
                <div class="input-group">
                    <input type="text" name="productName" th:value="${param.productName}"
                           class="form-control" placeholder="🔍 Search by product name">
                    <button class="btn btn-primary" type="submit">Search</button>
                </div>
            </form>

            <!-- Orders Table -->
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Product Name</th>
                        <th>Create At</th>
                        <th>Status</th>
                        <th>Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orderPage.content}">
                        <td th:text="${order.orderId}"></td>
                        <td th:text="${order.productName}"></td>
                        <td th:text="${#temporals.format(order.createAt, 'dd-MM-yyyy HH:mm')}"></td>
                        <td th:text="${order.status}"></td>
                        <td th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <a th:if="${currentPage > 0}"
                   th:href="@{/user/orders(page=${currentPage - 1})}">Previous</a>
                <span>Page <span th:text="${currentPage + 1}"></span> / <span th:text="${totalPages}"></span></span>
                <a th:if="${currentPage + 1 < totalPages}"
                   th:href="@{/user/orders(page=${currentPage + 1})}">Next</a>
            </div>
        </div>
    </div>
</section>


</body>
</html>
