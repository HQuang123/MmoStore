<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lịch sử đơn hàng</title>

    <th:block th:fragment="cssFragment">
        <link rel="stylesheet" href="/css/order-history.css">
    </th:block>

    <th:block th:fragment="jsFragment">
        <script src="/javascript/order-history.js"></script>
    </th:block>
</head>
<body>

<section class="container-fluid order-history-page">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <h2 class="page-title">📦 Lịch sử đơn hàng</h2>

            <!-- Khu vực lọc -->
            <div class="filter-container">
                <form class="filter-form" method="get" action="/user/orders">
                    <div>
                        <label class="form-label">Trạng thái</label>
                        <select name="status" class="form-select">
                            <option value="">-- Tất cả trạng thái --</option>
                            <option th:each="st : ${statuses}"
                                    th:value="${st.name()}"
                                    th:text="${st.name()}"
                                    th:selected="${st.name() == selectedStatus}">
                            </option>
                        </select>
                    </div>

                    <div>
                        <label class="form-label">Tổng tối thiểu</label>
                        <input type="text" id="minTotal" class="form-control" name="minTotal"
                               th:value="${param.minTotal}" placeholder="vd: 1,000,000">
                    </div>

                    <div>
                        <label class="form-label">Tổng tối đa</label>
                        <input type="text" id="maxTotal" class="form-control" name="maxTotal"
                               th:value="${param.maxTotal}" placeholder="vd: 10,000,000">
                    </div>

                    <div>
                        <label class="form-label">Từ ngày</label>
                        <input type="date" name="startDate" th:value="${param.startDate}">
                    </div>

                    <div>
                        <label class="form-label">Đến ngày</label>
                        <input type="date" name="endDate" th:value="${param.endDate}">
                    </div>

                    <div class="d-flex gap-2 align-items-end">
                        <button type="submit" class="btn btn-secondary filter-btn">
                            <i class="bi bi-funnel"></i> Lọc
                        </button>
                        <a href="/user/orders" class="btn btn-outline-danger">
                            <i class="bi bi-x-circle"></i> Xóa lọc
                        </a>
                    </div>
                </form>
            </div>

            <!-- Tìm kiếm -->
            <form th:action="@{/user/orders}" method="get" class="mb-3">
                <div class="input-group">
                    <input type="text" name="productName" th:value="${param.productName}"
                           class="form-control" placeholder="🔍 Tìm theo tên sản phẩm">
                    <button class="btn btn-primary" type="submit">Tìm kiếm</button>
                </div>
            </form>

            <!-- Bảng đơn hàng -->
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>Mã đơn hàng</th>
                        <th>Tên sản phẩm</th>
                        <th>Số lượng</th>
                        <th>Tổng cộng</th>
                        <th>Tên shop</th> <!-- Thêm -->
                        <th>Ngày tạo</th>
                        <th>Trạng thái</th>
                        <th>Chi tiết</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Nếu không có đơn hàng -->
                    <tr th:if="${#lists.isEmpty(orderPage.content)}">
                        <td colspan="10" class="text-center text-muted py-4">
                            💤 Bạn không có đơn hàng nào.
                        </td>
                    </tr>
                    <tr th:each="order, iStat : ${orderPage.content}">
                        <td th:text="${order.orderId}"></td>
                        <td th:text="${order.productName}"></td>

                        <td th:text="${order.quantity}"></td>
                        <td th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>

                        <!-- Cột mới: Shop ID + Shop Name -->
                        <td th:text="${order.shopName}"></td>

                        <td th:text="${#temporals.format(order.createAt, 'dd-MM-yyyy HH:mm')}"></td>
                        <td th:text="${order.status}"></td>
                        <td>
                            <!-- Hiển thị nút chỉ khi có values và status = COMPLETED -->
                            <div th:if="${order.values != null and !order.values.isEmpty() and order.status == 'COMPLETED'}">
                                <button class="btn btn-sm btn-info mb-2"
                                        type="button"
                                        th:attr="data-bs-toggle='modal', data-bs-target='#detailModal' + ${order.orderId}">
                                    👁 Xem chi tiết
                                </button>

                                <!-- Modal -->
                                <div class="modal fade" th:id="'detailModal' + ${order.orderId}" tabindex="-1"
                                     aria-labelledby="detailModalLabel" aria-hidden="true">
                                    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                                        <div class="modal-content">

                                            <div class="modal-header bg-info text-white">
                                                <h5 class="modal-title" th:id="'detailModalLabel' + ${order.orderId}">
                                                    Chi tiết đơn hàng
                                                    <span th:text="${order.orderId}" class="fw-bold"></span>
                                                </h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>

                                            <!-- Thêm bảng có cột STT -->
                                            <div class="modal-body">
                                                <div class="table-responsive">
                                                    <table class="table table-bordered table-sm align-middle">
                                                        <thead class="table-light text-center">
                                                        <tr>
                                                            <th>STT</th>
                                                            <th>Thuộc tính</th>
                                                            <th>Giá trị</th>
                                                        </tr>
                                                        </thead>
                                                        <tbody>
                                                        <tr th:each="map, stat : ${order.values}">
                                                            <td th:text="${stat.index + 1}" class="text-center"></td>
                                                            <td colspan="2">
                                                                <table class="w-100">
                                                                    <tr th:each="entry : ${map.entrySet()}">
                                                                        <td class="fw-bold" style="width: 40%;" th:text="${entry.key} + ':'"></td>
                                                                        <td th:text="${entry.value}"></td>
                                                                    </tr>
                                                                </table>
                                                            </td>
                                                        </tr>
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>

                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Nếu không có values hoặc status != COMPLETED -->
                            <span th:if="${order.values == null or order.values.isEmpty() or order.status != 'COMPLETED'}">—</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <!-- PHÂN TRANG -->
            <!-- PHÂN TRANG -->
            <div class="pagination d-flex justify-content-center align-items-center gap-3 mt-3">

                <!-- Nút TRƯỚC -->
                <a th:if="${currentPage > 1}"
                   th:href="@{/user/orders(
            page=${currentPage - 1},
            status=${param.status},
            minTotal=${param.minTotal},
            maxTotal=${param.maxTotal},
            startDate=${param.startDate},
            endDate=${param.endDate},
            productName=${param.productName},
            paymentMethod=${param.paymentMethod}
       )}"
                   class="btn btn-outline-primary">
                    ← Trước
                </a>

                <!-- Số trang -->
                <span>
        Trang <span th:text="${currentPage}"></span> /
        <span th:text="${totalPages}"></span>
    </span>

                <!-- Nút SAU -->
                <a th:if="${currentPage < totalPages}"
                   th:href="@{/user/orders(
            page=${currentPage + 1},
            status=${param.status},
            minTotal=${param.minTotal},
            maxTotal=${param.maxTotal},
            startDate=${param.startDate},
            endDate=${param.endDate},
            productName=${param.productName},
            paymentMethod=${param.paymentMethod}
       )}"
                   class="btn btn-outline-primary">
                    Sau →
                </a>
            </div>

        </div>
    </div>
</section>

</body>
</html>
