<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::content}, ~{::css}, ~{::js})}">

<head>
    <th:block th:fragment="css">
        <!-- CSS riêng cho trang reset password (nếu có) -->
        <link rel="stylesheet" th:href="@{/css/reset-password.css}" />
    </th:block>
    <th:block th:fragment="js">
        <script th:src="@{/javascript/reset-password.js}"></script>
    </th:block>
</head>
<body>
<th:block th:fragment="content">
    <div class="container mt-5">
        <h2 class="text-center">Đặt lại mật khẩu</h2>
        <div th:if="${error}" class="text-danger fw-bold text-center mt-2">
            [[${error}]]
        </div>

        <form th:action="@{/reset-password}" method="post" id="resetForm" class="mx-auto" style="max-width:400px;">
            <input type="hidden" th:name="token" th:value="${token}" />
            <input type="hidden" name="email" th:value="${email}" />

            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu mới</label>
                <input type="password" id="password" name="password" class="form-control" required />
            </div>

            <div class="mb-3">
                <label for="confirm" class="form-label">Xác nhận mật khẩu</label>
                <input type="password" id="confirm" name="confirmPassword" class="form-control" required />

                <div id="confirmPasswordHelp" class="form-text text-danger" style="display: none;">
                    Mật khẩu không khớp.
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-success w-100">Xác nhận</button>
        </form>
    </div>
</th:block>

</body>
</html>
