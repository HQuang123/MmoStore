<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <th:block th:fragment="cssFragment">
        <link rel="stylesheet" href="#">
    </th:block>

    <th:block th:fragment="jsFragment">
        <script th:src="@{/javascript/reset-password.js}"></script>
    </th:block>
</head>
<body>
    <section>
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow">
                        <div class="card-header text-center">
                            <p class="fs-4">Đặt mật khẩu mới</p>
                        </div>
                        <div class="card-body">

                            <form id="resetForm" th:action="@{/reset-password}" method="post">

                                <input type="hidden" name="token" th:value="${token}" />

                                <div class="mb-3">
                                    <label class="form-label">Mật khẩu mới</label>
                                    <input class="form-control" name="password" type="password" required />
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Nhập lại mật khẩu mới</label>
                                    <input class="form-control" name="confirmPassword" type="password" required />
                                    <div id="confirmPasswordHelp" class="form-text text-danger" style="display:none;">
                                        Mật khẩu không khớp
                                    </div>
                                </div>

                                <button id="submitBtn" type="submit" class="btn btn-primary col-12" disabled>
                                    Đổi mật khẩu
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
