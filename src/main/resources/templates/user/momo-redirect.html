<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}">

<th:block th:fragment="cssFragment">
    <link rel="stylesheet" th:href="@{/css/homepage.css}">
    <!--    <link rel="stylesheet" th:href="@{/css/homepage.css}">-->
</th:block>

<th:block th:fragment="jsFragment">
    <script src="/javascript/homepage.js"></script>
</th:block>

<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section>
    <div class="container mt-5 text-center">
        <div th:if="${isSuccess}">
            <div class="alert alert-success p-4 rounded shadow">
                <h2>✅ Giao dịch thành công !</h2>
                <p>ID giao dịch: <strong th:text="${depositId}"></strong></p>
                <p>Số tiền </p>: <strong th:text="${amount}"></strong> VND
                <p th:text="${message}">Bạn đã nạp tiền thành công vào tài khoản.</p>
                <a th:href="@{/}" class="btn btn-primary mt-3">Quay trở lại trang chính</a>
            </div>
        </div>

        <div th:if="${!isSuccess}">
            <div class="alert alert-danger p-4 rounded shadow">
                <h2>❌ Giao dịch thất bại !</h2>
                <p>ID giao dịch: <strong th:text="${depositId}"></strong></p>
                <p th:text="${message}">Có lỗi xảy ra khi giao dịch, vui lòng thử lại sau.</p>
            </div>
        </div>
    </div>
</section>
</body>
</html>
