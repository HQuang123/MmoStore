<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <th:block th:fragment="cssFragment">
        <link rel="stylesheet" href="#">
    </th:block>

    <th:block th:fragment="jsFragment">

    </th:block>
</head>
<body>
<section>
    <div class="container mt-5">
        <h2>Lịch sử giao dịch</h2>

        <table class="table table-striped">
            <thead>
            <tr>
                <th>Mã Giao Dịch</th>
                <th>
                    <a th:href="@{/user/transactions(page=0, size=${transactionPage.size}, sort='type,' + (${sortField == 'type' && sortDir == 'ASC'} ? 'DESC' : 'ASC'))}">Loại</a>
                </th>
                <th>
                    <a th:href="@{/user/transactions(page=0, size=${transactionPage.size}, sort='amount,' + (${sortField == 'amount' && sortDir == 'ASC'} ? 'DESC' : 'ASC'))}">Số tiền</a>
                </th>
                <th>
                    <a th:href="@{/user/transactions(page=0, size=${transactionPage.size}, sort='status,' + (${sortField == 'status' && sortDir == 'ASC'} ? 'DESC' : 'ASC'))}">Trạng thái</a>
                </th>
                <th>
                    <a th:href="@{/user/transactions(page=0, size=${transactionPage.size}, sort='detail,' + (${sortField == 'detail' && sortDir == 'ASC'} ? 'DESC' : 'ASC'))}">Chi tiết</a>
                </th>
                <th>
                    <a th:href="@{/user/transactions(page=0, size=${transactionPage.size}, sort='createAt,' + (${sortField == 'createAt' && sortDir == 'ASC'} ? 'DESC' : 'ASC'))}">Thời gian</a>
                </th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${transactionPage.empty}">
                <td colspan="6" class="text-center">Không tìm thấy giao dịch nào.</td>
            </tr>
            <tr th:each="tx : ${transactionPage.content}">
                <td th:text="${tx.id}">D_1</td>
                <td>
                    <span th:if="${tx.type.name() == 'DEPOSIT'}" class="text-success" th:text="${tx.type.displayName}"></span>
                    <span th:if="${tx.type.name() == 'WITHDRAWAL'}" class="text-danger" th:text="${tx.type.displayName}"></span>
                </td>
                <td th:classappend="${tx.type.name() == 'DEPOSIT'} ? 'text-success' : 'text-danger'">
                    <span th:text="${tx.type.name() == 'DEPOSIT'} ? '+' : '-'"></span>
                    <span th:text="${#numbers.formatDecimal(tx.amount, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span>
                </td>
                <td th:text="${tx.status}">Completed</td>
                <td th:text="${tx.detail}">Nạp tiền</td>
                <td th:text="${#temporals.format(tx.createAt, 'dd/MM/yyyy HH:mm')}"></td>
            </tr>
            </tbody>
        </table>

        <nav th:if="${transactionPage.totalPages > 1}" aria-label="Page navigation">
            <ul class="pagination justify-content-center">

                <li class="page-item" th:classappend="${transactionPage.isFirst()} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/user/transactions(
                           page=${currentPage - 1},
                           size=${transactionPage.size},
                           sort=${sortField + ',' + sortDir}
                       )}">Previous</a>
                </li>

                <li th:each="pageNum : ${#numbers.sequence(1, transactionPage.totalPages)}"
                    class="page-item" th:classappend="${pageNum == currentPage + 1} ? 'active'">
                    <a class="page-link"
                       th:href="@{/user/transactions(
                           page=${pageNum - 1},
                           size=${transactionPage.size},
                           sort=${sortField + ',' + sortDir}
                       )}"
                       th:text="${pageNum}">
                    </a>
                </li>

                <li class="page-item" th:classappend="${transactionPage.isLast()} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/user/transactions(
                           page=${currentPage + 1},
                           size=${transactionPage.size},
                           sort=${sortField + ',' + sortDir}
                       )}">Next</a>
                </li>
            </ul>
        </nav>

        <div class="text-center" th:if="${transactionPage.totalPages > 0}">
            Trang <strong th:text="${currentPage + 1}">1</strong> trên <strong th:text="${transactionPage.totalPages}">1</strong>
        </div>

    </div>
</section>
</body>
</html>
