<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}"
      xmlns:x-transition="http://www.w3.org/1999/xhtml">

<th:block th:fragment="cssFragment">
    <link rel="stylesheet" th:href="@{/css/withdraw.css}">
</th:block>

<th:block th:fragment="jsFragment">
    <script src="/javascript/top-up.js"></script>
</th:block>

<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-body" x-data="{
                    isModalOpen: false,
                    sortCol: -1,
                    sortDir: 'none',

                    allRows: [],
                    totalItems: 0,
                    totalPages: 0,
                    currentPage: 1,
                    itemsPerPage: 5, // Show 5 items per page


                    sortTable(colIndex, type) {
                        // 1. Determine sort direction
                        if (this.sortCol === colIndex) {
                            this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
                        } else {
                            this.sortDir = 'desc'; // Default to descending
                        }
                        this.sortCol = colIndex;
                        const direction = this.sortDir === 'asc' ? 1 : -1;

                        // 2. MODIFIED: Sort the master 'allRows' list, not just the visible page
                        const sortedRows = this.allRows.sort((a, b) => {
                            const aVal = a.querySelectorAll('td')[colIndex].innerText;
                            const bVal = b.querySelectorAll('td')[colIndex].innerText;

                            let aComp, bComp;
                            if (type === 'number') {
                                aComp = parseFloat(aVal.replace(/,/g, ''));
                                bComp = parseFloat(bVal.replace(/,/g, ''));
                            } else if (type === 'date') {
                                aComp = new Date(aVal);
                                bComp = new Date(bVal);
                            } else {
                                aComp = aVal.toLowerCase();
                                bComp = bVal.toLowerCase();
                            }

                            if (aComp < bComp) return -1 * direction;
                            if (aComp > bComp) return 1 * direction;
                            return 0;
                        });

                        // 3. MODIFIED: Update allRows, reset to page 1, and re-render
                        this.allRows = sortedRows;
                        this.currentPage = 1;
                        this.updatePaginatedRows();
                    },

                    updatePaginatedRows() {
                        const table = document.getElementById('withdrawalTable');
                        if (!table) return;
                        const tbody = table.querySelector('tbody');
                        if (!tbody) return;

                        const start = (this.currentPage - 1) * this.itemsPerPage;
                        const end = start + this.itemsPerPage;
                        const rowsToShow = this.allRows.slice(start, end);

                        tbody.innerHTML = ''; // Clear current page
                        rowsToShow.forEach((row, index) => {
                            // Update the STT (first column) to be correct for the page
                            const sttCell = row.querySelector('td:first-child');
                            if (sttCell) {
                                sttCell.innerText = start + index + 1;
                            }
                            tbody.appendChild(row);
                        });
                    },

                    nextPage() {
                        if (this.currentPage < this.totalPages) {
                            this.currentPage++;
                            this.updatePaginatedRows();
                        }
                    },

                    prevPage() {
                        if (this.currentPage > 1) {
                            this.currentPage--;
                            this.updatePaginatedRows();
                        }
                    }
                    // ---------------------------------
                }"
                 x-init="() => {
                    // ADDED: Initialize pagination when component loads
                    const table = document.getElementById('withdrawalTable');
                    if (table) {
                        const tbody = table.querySelector('tbody');
                        if (tbody) {
                            this.allRows = Array.from(tbody.querySelectorAll('tr'));
                            this.totalItems = this.allRows.length;
                            this.totalPages = Math.ceil(this.totalItems / this.itemsPerPage);
                            this.updatePaginatedRows(); // Initial render of page 1
                        }
                    }
                }">
                <h3 class="card-title mb-4">Withdraw Money</h3>
                <form th:action="@{/user/wallet/withdraw}" th:object="${withdrawal}" method="post">
                    <div class="mb-3">
                        <label for="accountHolder" class="form-label">Tên chủ tài khoản</label>
                        <input id="accountHolder" type="text" th:field="*{accountHolder}" class="form-control" placeholder="e.g. Nguyen Van A" required>
                        <div style="color: red; font-size: 0.9em;"
                             th:if="${#fields.hasErrors('accountHolder')}"
                             th:errors="*{accountHolder}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="accountNumber" class="form-label">Số tài khoản</label>
                        <input  id= "accountNumber"
                                th:field="*{bankAccount}" class="form-control"
                                placeholder="Your bank account number"
                                required type="number">
                        <div style="color: red; font-size: 0.9em;"
                             th:if="${#fields.hasErrors('bankAccount')}"
                             th:errors="*{bankAccount}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Chọn ngân hàng</label>
                        <select th:field="*{bank}" class="form-select" required>
                            <option value="">-- Choose Bank --</option>
                            <option th:each="bank : ${banks}"
                                    th:value="${bank}"
                                    th:text="${bank.displayName}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="amount">Số tiền (VND)</label>
                        <input type="number" id="amount"
                               th:field="*{amount}" class="form-control"
                               min="10000" step="1000"
                               placeholder="Nhập số tiền ít nhất 10,000 đồng" required>
                        <div style="color: red; font-size: 0.9em;"
                             th:if="${#fields.hasErrors('amount')}"
                             th:errors="*{amount}">
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row items-center gap-3 mt-5">
                        <button
                                type="submit"
                                class="w-full sm:w-auto flex-1 sm:flex-none justify-center inline-flex items-center gap-2 px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h12v4a2 2 0 002-2V6a2 2 0 00-2-2H4zm0 6a2 2 0 00-2 2v4a2 2 0 002 2h12a2 2 0 002-2v-4a2 2 0 00-2-2H4zm10 3a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
                            </svg>
                            Rút tiền
                        </button>

                        <button
                                type="button"
                                @click="isModalOpen = true; $nextTick(() => {
                                    const table = document.getElementById('withdrawalTable');
                                    if (table && allRows.length === 0) {
                                        const tbody = table.querySelector('tbody');
                                        if (tbody) {
                                            allRows = Array.from(tbody.querySelectorAll('tr'));
                                            totalItems = allRows.length;
                                            totalPages = Math.ceil(totalItems / itemsPerPage);
                                            updatePaginatedRows();
                                        }
                                    }
                                })"
                                class="w-full sm:w-auto flex-1 sm:flex-none justify-center inline-flex items-center gap-2 px-6 py-3 bg-white text-gray-700 font-semibold rounded-lg shadow-md border border-gray-300 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75 transition-all">
                            Lịch sử rút tiền
                        </button>
                    </div>
                </form>
                <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>


                <div
                        x-show="isModalOpen"
                        x-transition:enter="ease-out duration-300"
                        x-transition:enter-start="opacity-0"
                        x-transition:enter-end="opacity-100"
                        x-transition:leave="ease-in duration-200"
                        x-transition:leave-start="opacity-100"
                        x-transition:leave-end="opacity-0"
                        class="fixed inset-0 z-50 flex items-center justify-center p-4"
                        style="display: none;"
                        aria-labelledby="modal-title"
                        role="dialog"
                        aria-modal="true">

                    <div @click="isModalOpen = false" class="fixed inset-0 bg-black bg-opacity-50 transition-opacity" aria-hidden="true"></div>

                    <div
                            x-show="isModalOpen"
                            x-transition:enter="ease-out duration-300"
                            x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                            x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
                            x-transition:leave="ease-in duration-200"
                            x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
                            x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                            class="relative w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden transform transition-all sm:my-8">

                        <div class="flex items-start justify-between p-5 border-b border-gray-200">
                            <h2 class="text-2xl font-bold text-gray-900" id="modal-title">
                                Lịch sử rút tiền
                            </h2>
                            <button
                                    @click="isModalOpen = false"
                                    type="button"
                                    class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center transition-colors">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                            </button>
                        </div>

                        <div class="p-6">
                            <div class="text-center p-10" th:if="${withdrawals == null || withdrawals.isEmpty()}">
                                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                    <path vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2zm5-4h.01M15 9h.01" />
                                </svg>
                                <h3 class="mt-2 text-sm font-semibold text-gray-900">Không có lịch sử</h3>
                                <p class="mt-1 text-sm text-gray-500">Bạn chưa có giao dịch rút tiền nào.</p>
                            </div>

                            <div class="overflow-x-auto rounded-xl border border-primary-100" th:if="${withdrawals != null && !withdrawals.isEmpty()}">
                                <table id="withdrawalTable"
                                       class="min-w-full divide-y divide-primary-100">
                                    <thead class="bg-primary-50">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-bold text-primary-600 uppercase tracking-wider">
                                            STT
                                        </th>
                                        <th @click="sortTable(1, 'number', $event)"
                                            class="px-6 py-3 text-left text-xs font-bold text-primary-600 uppercase tracking-wider cursor-pointer select-none">
                                            Số tiền
                                            <svg class="inline h-4 w-4 ml-1 sort-icon"
                                                 :class="{ 'asc': sortCol === 1 && sortDir === 'asc', 'desc': sortCol === 1 && sortDir === 'desc' }"
                                                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path class="arrow-up" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                                                <path class="arrow-down" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                            </svg>
                                        </th>
                                        <th class="px-6 py-3 text-left text-xs font-bold text-primary-600 uppercase tracking-wider">
                                            Trạng thái
                                        </th>
                                        <th @click="sortTable(3, 'date', $event)"
                                            class="px-6 py-3 text-left text-xs font-bold text-primary-600 uppercase tracking-wider cursor-pointer select-none">
                                            Ngày tháng
                                            <svg class="inline h-4 w-4 ml-1 sort-icon"
                                                 :class="{ 'asc': sortCol === 3 && sortDir === 'asc', 'desc': sortCol === 3 && sortDir === 'desc' }"
                                                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path class="arrow-up" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                                                <path class="arrow-down" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                            </svg>
                                        </th>
                                    </tr>
                                    </thead>
                                    <tbody class="bg-white divide-y divide-primary-50">
                                    <tr th:each="w, iterStat : ${withdrawals}" class="hover:bg-primary-50 transition-all">
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-semibold"
                                            th:text="${iterStat.index + 1}">
                                        </td>

                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900"
                                            th:text="${#numbers.formatInteger(w.amount, 0, 'COMMA')}"></td>

                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <span th:classappend="
                                                ${w.status} == 'Pending' ? 'px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800 border border-yellow-200' :
                                                (${w.status} == 'Approved' ? 'px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-600 border border-green-200' :
                                                'px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-600 border border-red-200')
                                            " th:text="${w.status}"></span>
                                        </td>

                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
                                            th:text="${#temporals.format(w.createAt, 'yyyy-MM-dd HH:mm')}"></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div x-show="totalPages > 1"
                                 class="flex items-center justify-between mt-4 px-1 py-3"
                                 th:if="${withdrawals != null && !withdrawals.isEmpty()}">
                                <span class="text-sm text-gray-700">
                                    Showing
                                    <span class="font-semibold text-gray-900" x-text="(currentPage - 1) * itemsPerPage + 1"></span>
                                    to
                                    <span class="font-semibold text-gray-900" x-text="Math.min(currentPage * itemsPerPage, totalItems)"></span>
                                    of
                                    <span class="font-semibold text-gray-900" x-text="totalItems"></span>
                                    Entries
                                </span>

                                <div class="inline-flex items-center space-x-2">
                                    <button
                                            @click="prevPage()"
                                            :disabled="currentPage === 1"
                                            :class="{ 'opacity-50 cursor-not-allowed': currentPage === 1 }"
                                            class="relative inline-flex items-center px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">
                                        Previous
                                    </button>
                                    <button
                                            @click="nextPage()"
                                            :disabled="currentPage === totalPages"
                                            :class="{ 'opacity-50 cursor-not-allowed': currentPage === totalPages }"
                                            class="relative inline-flex items-center px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">
                                        Next
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
