<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}">

<th:block th:fragment="cssFragment">
    <link rel="stylesheet" th:href="@{/css/homepage.css}">
    <!--    <link rel="stylesheet" th:href="@{/css/homepage.css}">-->
</th:block>

<th:block th:fragment="jsFragment">
    <script src="/javascript/top-up.js"></script>
</th:block>

<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section>
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header text-center bg-primary text-white rounded-top-4">
                <h4 class="mb-0">Top Up Wallet</h4>
            </div>

            <div class="card-body">
                <!-- Display current balance -->
                <div class="mb-3 text-center">
                    <h5>Số dư hiện tại của bạn:</h5>
                    <h3 class="text-success fw-bold"
                        th:text="${#numbers.formatDecimal(user.balance, 0, 'COMMA', 2, 'POINT')} + ' ₫'">
                        0 ₫
                    </h3>
                </div>

                <!-- Top-up form -->
                <form th:action="@{/user/momo/top-up}" method="post" id="topupForm" th:object="${deposit}">
                    <div class="mb-3">
                        <label for="amount" class="form-label fw-semibold">Hãy nhập số tiền</label>
                        <div class="input-group">
                            <input th:field="*{amount}" type="text" id="formattedAmount" class="form-control amount-input"
                                   placeholder="Enter amount (e.g. 10,000)" required>
                            <span class="input-group-text">₫</span>
                        </div>
                        <!-- hidden clean numeric value -->
                        <input type="hidden" name="amount" id="amount">
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-3">
                            Nạp tiền vào tài khoản
                        </button>
                    </div>
                </form>
            </div>

            <div class="card-footer text-center text-muted small">
                <p class="mb-0">Nạp tối thiểu: 10,000 ₫</p>
            </div>
        </div>
    </div>
</section>
</body>
</html>
