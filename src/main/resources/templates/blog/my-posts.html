<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{base :: layout(~{::content}, ~{::cssFragment}, ~{::jsFragment})}">

    <!-- CSS -->
    <th:block th:fragment="cssFragment">
        <link rel="stylesheet" href="/css/my-posts.css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    </th:block>

    <!-- CONTENT -->
    <th:block th:fragment="content">
        <div class="container mt-4">
            <h2 class="mb-4 text-center">Bài viết của tôi</h2>

            <!-- Flash messages -->
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <!-- Bộ lọc tìm kiếm -->
            <form th:action="@{/blog/my-posts}" method="get" class="row g-2 mb-3 align-items-center">
                <div class="col-md-5">
                    <input type="text" name="title" th:value="${title}" class="form-control" placeholder="Tìm kiếm theo tiêu đề...">
                </div>
                <div class="col-md-4">
                    <select name="category" class="form-select">
                        <option value="">-- Chọn loại bài viết --</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.name}"
                                th:text="${cat.name}"
                                th:selected="${cat.name == category}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3 d-flex">
                    <button type="submit" class="btn btn-primary me-2 w-50">Tìm kiếm</button>
                    <a th:href="@{/blog/my-posts}" class="btn btn-secondary w-50">Clear</a>
                </div>
            </form>

            <!-- Nút tạo bài viết -->
            <div class="mb-3">
                <a href="/blog/create" class="btn btn-success">
                    <i class="fa-solid fa-plus"></i> Tạo bài viết mới
                </a>
            </div>

            <!-- Danh sách bài viết -->
            <div th:if="${myPosts.size() > 0}" th:each="post : ${myPosts}" class="card mb-4 shadow-sm">
                <div class="card-body">
                    <h4 class="card-title d-flex justify-content-between align-items-center">
                        <span th:text="${post.title}"></span>
                        <div>
                            <a th:href="@{/blog/edit/{id}(id=${post.id})}" class="btn btn-sm btn-outline-primary me-2">
                                <i class="fa-solid fa-pen-to-square"></i> Sửa
                            </a>

                            <form th:action="@{/blog/delete/{postId}(postId=${post.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Bạn có chắc muốn xóa bài viết này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="fa-solid fa-trash"></i> Xóa
                                </button>
                            </form>
                        </div>
                    </h4>

                    <p th:text="${post.content}" class="card-text"></p>
                    <img th:if="${post.imageUrl}" th:src="${post.imageUrl}"
                         class="img-fluid rounded mb-3" style="max-width: 50%; height: auto;"/>

                    <p class="text-muted">
                        <small>Đăng ngày: <span th:text="${#temporals.format(post.createAt, 'dd/MM/yyyy HH:mm')}"></span></small><br>
                        <small>Danh mục: <span th:text="${post.category.name}"></span></small>
                    </p>

                    <hr>

                    <!-- BÌNH LUẬN -->
                    <div>
                        <h6 class="fw-bold">Bình luận:</h6>

                        <!-- COMMENT CHA -->
                        <div th:each="comment : ${postCommentsMap[post.id]}"
                             th:if="${comment.parent == null}"
                             class="mb-3 p-2 border rounded bg-light">

                            <!-- Nội dung comment cha -->
                            <p class="mb-1">
                                <strong th:text="${comment.user != null ? comment.user.name : 'Ẩn danh'}"></strong>:
                                <span th:text="${comment.content}"></span>
                            </p>
                            <small class="text-muted"
                                   th:text="${#temporals.format(comment.createAt, 'dd/MM/yyyy HH:mm')}"></small>

                            <!-- REPLY (COMMENT CON) -->
                            <div class="ms-4 mt-2"
                                 th:each="reply : ${postCommentsMap[post.id]}"
                                 th:if="${reply.parent != null and reply.parent.id == comment.id}"
                            >

                                <div class="p-2 border rounded bg-white mb-2">
                                    <p class="mb-1">
                                        <strong th:text="${reply.user != null ? reply.user.name : 'Ẩn danh'}"></strong>:
                                        <span th:text="${reply.content}"></span>
                                    </p>
                                    <small class="text-muted"
                                           th:text="${#temporals.format(reply.createAt, 'dd/MM/yyyy HH:mm')}"></small>
                                </div>


                            </div>

                        </div>

                        <!-- FORM BÌNH LUẬN MỚI -->
                        <form th:action="@{'/blog/comment/' + ${post.id}}" method="post" class="mt-3">
                            <input type="hidden" name="postId" th:value="${post.id}">
                            <div class="input-group">
                                <input type="text" name="content" class="form-control" placeholder="Viết bình luận..." required>
                                <button type="submit" class="btn btn-outline-secondary">Gửi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Không có bài -->
            <div th:if="${myPosts.size() == 0}" class="alert alert-info text-center">
                Bạn chưa có bài viết nào.
            </div>

            <!-- Phân trang -->
            <nav th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center mt-4">

                    <!-- Previous -->
                    <li class="page-item" th:classappend="${currentPage == 1}? 'disabled'">
                        <a class="page-link"
                           th:href="@{/blog/my-posts(page=${currentPage-1 < 1 ? 1 : currentPage-1}, title=${title}, category=${category})}">
                            Previous
                        </a>
                    </li>

                    <!-- Các số trang -->
                    <li th:each="i : ${#numbers.sequence(1, totalPages)}"
                        class="page-item"
                        th:classappend="${i == currentPage}? 'active'">
                        <a class="page-link"
                           th:href="@{/blog/my-posts(page=${i}, title=${title}, category=${category})}"
                           th:text="${i}"></a>
                    </li>

                    <!-- Next -->
                    <li class="page-item" th:classappend="${currentPage == totalPages}? 'disabled'">
                        <a class="page-link"
                           th:href="@{/blog/my-posts(page=${currentPage+1 > totalPages ? totalPages : currentPage+1}, title=${title}, category=${category})}">
                            Next
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </th:block>

    <!-- JS -->
    <th:block th:fragment="jsFragment"></th:block>

</th:block>
</html>
