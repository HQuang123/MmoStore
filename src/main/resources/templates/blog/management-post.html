<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{base :: layout(~{::content}, ~{::cssFragment}, ~{::jsFragment})}">

    <!-- CSS -->
    <th:block th:fragment="cssFragment">
        <link rel="stylesheet" href="/css/blog.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    </th:block>

    <!-- CONTENT -->
    <th:block th:fragment="content">
        <div class="container mt-4">
            <h2 class="mb-4 text-center">Quản lý Blog (Admin)</h2>

            <!-- Flash message -->
            <div th:if="${successMessage != null and successMessage != ''}"
                 class="alert alert-success"
                 th:text="${successMessage}">
            </div>

            <!-- Bộ lọc tìm kiếm -->
            <form th:action="@{/admin/blog/management-post}" method="get" class="row g-2 mb-3 align-items-center">
                <div class="col-md-4">
                    <input type="text" name="title" th:value="${title != null ? title : ''}" class="form-control" placeholder="Tìm kiếm theo tiêu đề..."/>
                </div>
                <div class="col-md-3">
                    <select name="category" class="form-select">
                        <option value="">-- Chọn danh mục --</option>
                        <option th:each="cat : ${categories != null ? categories : {}}"
                                th:value="${cat.name}"
                                th:text="${cat.name}"
                                th:selected="${cat.name == (category != null ? category : '')}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select name="status" class="form-select">
                        <option value="">-- Chọn trạng thái --</option>
                        <option th:value="0" th:selected="${status != null and status==0}">Chờ duyệt</option>
                        <option th:value="1" th:selected="${status != null and status==1}">Đã duyệt</option>
                        <option th:value="-1" th:selected="${status != null and status==-1}">Từ chối</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">Lọc</button>
                    <a th:href="@{/admin/blog/management-post}" class="btn btn-secondary w-50">Xóa bộ lọc</a>
                </div>
            </form>

            <!-- Danh sách bài viết -->
            <div th:if="${postsPage != null and postsPage.content != null and postsPage.content.size() > 0}">
                <div th:each="post : ${postsPage.content}" class="card mb-3">
                    <div class="row g-0">
                        <!-- Ảnh thumbnail -->
                        <div class="col-md-2">
                            <img th:src="${post.imageUrl != null ? post.imageUrl : '/images/profile_img/default.jpg'}"
                                 class="img-fluid rounded-start" alt="Thumbnail"/>
                        </div>

                        <div class="col-md-10">
                            <div class="card-body">
                                <h5 class="card-title d-flex justify-content-between align-items-center">
                                    <span th:text="${post.title != null ? post.title : 'Tiêu đề'}">Tiêu đề</span>
                                    <span th:switch="${post.status != null ? post.status : -99}">
                                        <span th:case="1" class="badge bg-success">Đã duyệt</span>
                                        <span th:case="0" class="badge bg-warning">Chờ duyệt</span>
                                        <span th:case="-1" class="badge bg-danger">Từ chối</span>
                                        <span th:case="*">Không xác định</span>
                                    </span>
                                </h5>

                                <p th:text="${post.content != null ? post.content : ''}" class="card-text">Nội dung...</p>

                                <!-- Nút hành động -->
                                <div class="mt-2">
                                    <form th:if="${post.status == 0}"
                                          th:action="@{/admin/blog/approve/{id}(id=${post.id})}"
                                          method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-success">
                                            <i class="fa-solid fa-check"></i> Duyệt
                                        </button>
                                    </form>

                                    <form th:if="${post.status == 0}"
                                          th:action="@{/admin/blog/reject/{id}(id=${post.id})}"
                                          method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="fa-solid fa-ban"></i> Từ chối
                                        </button>
                                    </form>

                                    <form th:if="${post.status == 1}"
                                          th:action="@{/admin/blog/delete/{id}(id=${post.id})}"
                                          method="post" class="d-inline"
                                          onsubmit="return confirm('Bạn có chắc muốn xóa bài viết này?');">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="fa-solid fa-trash"></i> Xóa
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Không có bài -->
            <div th:if="${postsPage == null or postsPage.content == null or postsPage.content.size() == 0}"
                 class="alert alert-info text-center">
                Không có bài viết nào.
            </div>

            <!-- Phân trang -->
            <nav th:if="${postsPage != null and postsPage.totalPages != null and postsPage.totalPages > 1}">
                <ul class="pagination justify-content-center mt-4">
                    <!-- Previous -->
                    <li class="page-item" th:classappend="${currentPage == null or currentPage == 1} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/blog/management-post(page=${currentPage != null and currentPage > 1 ? currentPage - 1 : 1})}">
                            Previous
                        </a>
                    </li>

                    <!-- Các số trang -->
                    <li th:each="i : ${#numbers.sequence(1, postsPage.totalPages)}"
                        class="page-item"
                        th:classappend="${i == (currentPage != null ? currentPage : 1)} ? 'active'">
                        <a class="page-link"
                           th:href="@{/admin/blog/management-post(page=${i})}"
                           th:text="${i}">
                        </a>
                    </li>

                    <!-- Next -->
                    <li class="page-item" th:classappend="${currentPage == postsPage.totalPages} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/blog/management-post(page=${currentPage != null ? (currentPage + 1 <= postsPage.totalPages ? currentPage + 1 : postsPage.totalPages) : 1})}">
                            Next
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </th:block>

    <!-- JS -->
    <th:block th:fragment="jsFragment">
        <link rel="stylesheet" href="/css/blog-manager.css">
    </th:block>
</th:block>
</html>
