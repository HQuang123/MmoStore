<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gian hàng email</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <th:block th:fragment="cssFragment">
        <link rel="stylesheet" href="/css/product-list.css">
    </th:block>

    <th:block th:fragment="jsFragment">
        <script src="/javascript/product-list.js"></script>
    </th:block>
</head>
<body>

<section class="container-fluid py-4">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3">
            <div class="sidebar mb-4">
                <h5 class="filter-title">Bộ lọc</h5>
                <!--                <form action="/productList" method="post">-->
                <div class="mb-3">
                    <label class="form-label fw-bold">Chọn 1 hoặc nhiều sản phẩm</label><br>
                    <div th:each="category : ${categoryList}">
                        <div class="form-check"><input class="form-check-input" type="checkbox" name="category"
                                                       th:value="${category.categoryId}" th:text="${category.name}"
                                                       th:checked="${checkedCategory != null and checkedCategory.contains('' + category.categoryId)}">
                        </div>
                    </div>
                </div>
                <button class="btn btn-success w-100" id="buttonFilter">Tìm kiếm</button>
                <!--                </form>-->
            </div>

            <!-- Bài viết tham khảo -->
            <div class="sidebar">
                <h6>Bài viết tham khảo</h6>
                <img src="https://via.placeholder.com/200x150" class="img-fluid rounded mt-2" alt="Tham khảo">
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>Gian hàng email</h4>
                <div>
                    <button class="btn btn-outline-secondary btn-sm">Phổ biến</button>
                    <button class="btn btn-outline-secondary btn-sm" data-sort-by="price" data-sort-order="asc">Giá tăng dần</button>
                    <button class="btn btn-outline-secondary btn-sm" data-sort-by="price" data-sort-order="des">Giá giảm dần</button>
                </div>
            </div>

            <!-- Product Cards -->
            <div id="productContainer">
                <div th:each="product : ${productList}">
                    <div class="card card-product p-3" style="cursor: pointer;"
                         th:onclick="'window.location.href=\'/product/' + ${product.id} + '\';'">
                        <div class="row g-3 align-items-center">
                            <div class="col-md-2">
                                <img th:src="${product.productImageUrl()}" alt="product-img">
                            </div>
                            <div class="col-md-10">
                                <h5 th:text="${product.title}">Product Title</h5>
                                <p class="text-muted mb-1" th:text="'Người bán:' + ${product.shopName}">Shop Name</p>
                                <p class="mb-1" th:text="${product.description}">Product Description</p>
                                <span class="text-warning" th:text="${product.avgRating + '/10'}"></span>
                                <p class="fw-bold text-primary mt-2" th:text="${product.price}">Product Price</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Pagination -->
            <nav aria-label="Page navigation example">
                <ul class="pagination justify-content-center mt-4">
                    <li class="page-item disabled">
                        <a class="page-link" >Trước</a>
                    </li>
                    <li class="page-item active"><a class="page-link" href="#" data-page="0">1</a></li>
                    <li class="page-item"><a class="page-link" href="#" data-page="1">2</a></li>
                    <li class="page-item"><a class="page-link" href="#" data-page="2">3</a></li>
                    <li class="page-item">
                        <a class="page-link" href="#" data-page="1">Tiếp</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
