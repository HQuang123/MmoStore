<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}">
<head>
    <meta charset="UTF-8">
    <title>Manage Products</title>
</head>

<!-- CSS Fragment -->
<th:block th:fragment="cssFragment">
    <link rel="stylesheet" th:href="@{/css/seller.css}">
</th:block>

<!-- JS Fragment -->
<th:block th:fragment="jsFragment">
    <script src="/javascript/seller/seller-products.js"></script>
</th:block>

<!-- CONTENT Fragment -->
<section>
    <div class="container-fluid seller-layout">
        <div class="row">
            <!-- SIDEBAR -->
            <div id="sidebar" class="col-md-3 col-lg-2">
                <div class="text-center mb-3">
                    <img th:src="${shop.shopImageUrl}"
                         alt="Ảnh cửa hàng"
                         class="rounded-circle"
                         style="width:120px; height:120px; object-fit:cover;">
                </div>
                <h4 class="text-center mb-2" th:text="${shop.name}"></h4>
                <p class="text-center small text-muted" th:text="${shop.description}"></p>
                <hr class="border-secondary"/>
                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white" th:href="@{/seller/statistic}">
                            <i class="fa-solid fa-chart-line"></i> Thống kê
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link bg-secondary text-white rounded active" th:href="@{/seller/products}">
                            <i class="fa-solid fa-box"></i> Sản phẩm
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white" th:href="@{/seller/orders}">
                            <i class="fa-solid fa-file-invoice"></i> Đơn hàng
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white" th:href="@{/seller/shop/edit}">
                            <i class="fa-solid fa-pen-to-square"></i> Chỉnh sửa thông tin cửa hàng
                        </a>
                    </li>
                </ul>
            </div>

            <!-- MAIN CONTENT -->
            <div class="col-md-9 col-lg-10 p-4" id="page-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fa-solid fa-boxes-stacked me-2"></i>Quản lí sản phẩm</h2>
                    <div>
                        <a class="btn btn-primary" th:href="@{/seller/products/add}">
                            <i class="fa-solid fa-plus"></i> Thêm loại sản phẩm mới
                        </a>
                        <a class="btn btn-success me-2" th:href="@{/seller/items/create}">
                            <i class="fa-solid fa-plus"></i> Bổ sung sản phẩm tồn kho
                        </a>
                    </div>
                </div>

                <!-- SEARCH BAR -->
                <form th:action="@{/seller/products}" method="get" class="row gy-2 gx-3 align-items-end mb-4">

                    <!-- Keyword -->
                    <div class="col-md-3">
                        <label for="keyword" class="form-label fw-semibold">
                            <i class="fa-solid fa-magnifying-glass me-1"></i> Tên sản phẩm
                        </label>
                        <input type="text" id="keyword" name="keyword" class="form-control"
                               placeholder="Nhập tên sản phẩm..."
                               th:value="${keyword}">
                    </div>

                    <!-- Min Price -->
                    <div class="col-md-2">
                        <label for="minPrice" class="form-label fw-semibold">
                            <i class="fa-solid fa-arrow-down-1-9 me-1"></i> Giá tối thiểu
                        </label>
                        <div class="input-group">
                            <input type="number" id="minPrice" name="minPrice" class="form-control text-end"
                                   placeholder="0" min="0" step="1000"
                                   th:value="${minPrice}">
                            <span class="input-group-text">₫</span>
                        </div>
                    </div>

                    <!-- Max Price -->
                    <div class="col-md-2">
                        <label for="maxPrice" class="form-label fw-semibold">
                            <i class="fa-solid fa-arrow-up-9-1 me-1"></i> Giá tối đa
                        </label>
                        <div class="input-group">
                            <input type="number" id="maxPrice" name="maxPrice" class="form-control text-end"
                                   placeholder="" min="0" step="1000"
                                   th:value="${maxPrice}">
                            <span class="input-group-text">₫</span>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="col-md-3 text-end">
                        <button type="submit" class="btn btn-primary me-2 px-4">
                            <i class="fa-solid fa-filter me-1"></i> Lọc
                        </button>
                        <a th:href="@{/seller/products}" class="btn btn-outline-secondary px-4">
                            <i class="fa-solid fa-rotate-right me-1"></i> Làm mới
                        </a>
                    </div>
                </form>

                <div th:if="${message != null}">
                    <div th:text="${message}"></div>
                </div>

                <!-- PRODUCT LIST TABLE -->
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title mb-3">Danh sách sản phẩm</h4>

                        <div th:if="${#lists.isEmpty(productList)}">
                            <p class="text-center text-muted p-3">Không tìm thấy sản phẩm nào</p>
                        </div>

                        <div th:if="${!#lists.isEmpty(productList)}">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                <tr>
<!--                                    <th>ID</th>-->
                                    <th >Ảnh</th>
                                    <th>Tên</th>
                                    <th>Mô tả</th>
                                    <th>Giá</th>
                                    <th class="text-center"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="product : ${productList}">
<!--                                    <td th:text="${product.id()}"></td>-->
                                    <td>
                                        <img th:src="${product.productImageUrl()}"
                                             alt="Product Image"
                                             class="rounded"
                                             style="width:60px; height:60px; object-fit:cover;">
                                    </td>
                                    <td th:text="${product.title}"></td>
                                    <td th:text="${product.description()}"></td>
                                    <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'COMMA')} + ' VNĐ'"></td>

                                    <td class="text-center">
                                        <button class="btn btn-sm btn-outline-info me-1"
                                                th:attr="data-product-id=${product.id()}"
                                                onclick="openItemModal(this)">
                                            <i class="fa-solid fa-eye"></i> Xem chi tiết
                                        </button>
                                        <a class="btn btn-sm btn-outline-primary me-1"
                                           th:href="@{/seller/products/edit/{id}(id=${product.id()})}">
                                            <i class="fa-solid fa-pen"></i>
                                        </a>
                                        <a class="btn btn-sm btn-outline-danger"
                                           th:href="@{/seller/products/delete/{id}(id=${product.id()})}"
                                           onclick="return confirm('Are you sure you want to delete this product?');">
                                            <i class="fa-solid fa-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>

                            <!-- PAGINATION -->
                            <nav th:if="${totalPages > 1}">
                                <ul class="pagination justify-content-center">
                                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                        <a class="page-link" th:href="@{/seller/products(page=${currentPage - 1})}">Previous</a>
                                    </li>

                                    <li class="page-item"
                                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                        th:classappend="${i == currentPage} ? 'active'">
                                        <a class="page-link"
                                           th:href="@{/seller/products(page=${i})}"
                                           th:text="${i + 1}"></a>
                                    </li>

                                    <li class="page-item"
                                        th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                        <a class="page-link"
                                           th:href="@{/seller/products(page=${currentPage + 1})}">Next</a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- ITEM DETAIL MODAL -->
    <!-- ITEM MODAL -->
    <div class="modal fade" id="itemModal" tabindex="-1" aria-labelledby="itemModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="itemModalLabel">Danh sách Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body" style="max-height: 65vh; overflow-y: auto;">
                    <div id="itemTableContainer">
                        <p class="text-center text-muted">Chưa có dữ liệu</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>


</section>

</html>
