<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::content}, ~{::cssFragment}, ~{::jsFragment})}">

<!-- Custom CSS -->
<th:block th:fragment="cssFragment">
    <link rel="stylesheet" th:href="@{/css/seller.css}">
</th:block>

<!-- Custom JS -->
<th:block th:fragment="jsFragment">
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="/javascript/seller-order_history.js"></script>
</th:block>

<!-- CONTENT -->
<th:block th:fragment="content">
    <!-- Thêm class seller-layout để tách biệt CSS -->
    <div class="seller-layout container-fluid">
        <!-- SIDEBAR -->
        <div id="sidebar" class="col-md-3 col-lg-2">
            <div class="text-center mb-3">
                <img th:src="${shop.shopImageUrl}"
                     alt="Shop Image"
                     class="rounded-circle"
                     style="width:120px; height:120px; object-fit:cover;">
            </div>
            <h4 class="text-center mb-2" th:text="${shop.name}"></h4>
            <p class="text-center small text-muted" th:text="${shop.description}"></p>
            <hr class="border-secondary"/>

            <ul class="nav flex-column">
                <li class="nav-item mb-2">
                    <a class="nav-link text-white" th:href="@{/seller/statistic}">
                        <i class="fa-solid fa-chart-line"></i> Statistics
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link text-white" th:href="@{/seller/products}">
                        <i class="fa-solid fa-box"></i> Products
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link active bg-secondary text-white rounded" th:href="@{/seller/orders}">
                        <i class="fa-solid fa-file-invoice"></i> Orders
                    </a>
                </li>
            </ul>
            <li class="nav-item mb-2">
                <a class="nav-link text-white" th:href="@{/seller/shop/edit}">
                    <i class="fa-solid fa-file-invoice"></i> Edit Shop Information
                </a>
            </li>
        </div>

        <!-- MAIN CONTENT -->
        <div id="page-content" class="col-md-9 col-lg-10 p-4">
            <h3 class="mb-3">
                <i class="fa-solid fa-clock-rotate-left"></i> Order History
            </h3>

            <!-- FILTER FORM -->
            <form method="get" th:action="@{/seller/orders}" class="filter-form">
                <div class="row g-2 mb-3 align-items-end">
                    <div class="col-md-2">
                        <label>Quantity ≥</label>
                        <input type="number" name="minQuantity" class="form-control" th:value="${minQuantity}">
                    </div>
                    <div class="col-md-2">
                        <label>Min Total</label>
                        <input type="text" id="minTotal" name="minTotal" class="form-control"
                               th:value="${minTotal}" placeholder="VD: 1.000.000">
                    </div>
                    <div class="col-md-2">
                        <label>Max Total</label>
                        <input type="text" id="maxTotal" name="maxTotal" class="form-control"
                               th:value="${maxTotal}" placeholder="VD: 10.000.000">
                    </div>
                    <div class="col-md-2">
                        <label>From Date</label>
                        <input type="date" name="startDate" class="form-control" th:value="${startDate}">
                    </div>
                    <div class="col-md-2">
                        <label>To Date</label>
                        <input type="date" name="endDate" class="form-control" th:value="${endDate}">
                    </div>
                    <div class="col-md-2">
                        <label>Status</label>
                        <select name="status" class="form-select">
                            <option value="">All</option>
                            <option th:each="st : ${statuses}"
                                    th:value="${st}" th:text="${st}"
                                    th:selected="${selectedStatus == st}"></option>
                        </select>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2 mb-4">
                    <button type="submit" class="btn btn-primary">Filter</button>
                    <a th:href="@{/seller/orders}" class="btn btn-secondary">Clear</a>
                </div>
            </form>
            <!-- EXPORT BUTTON  -->
            <div class="d-flex justify-content-end mb-2">
                <button id="btnExportXLSX" class="btn btn-success me-2" title="Export to Excel"><i
                        class="fa-solid fa-file-excel me-1"></i> Export XLSX
                </button>
            </div>
            <!-- ORDER TABLE -->
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                <tr>
                    <th>Order ID</th>
                    <th>Product ID</th>
                    <th>Product Name</th>
                    <th>Quantity</th>
                    <th>Unit Price</th>
                    <th>Total</th>
                    <th>Order Date</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orderList}">
                    <td th:text="${o.orderId}"></td>
                    <td th:text="${o.productId}"></td>
                    <td th:text="${o.productTitle}"></td>
                    <td th:text="${o.quantity}"></td>
                    <td th:text="${#numbers.formatDecimal(o.price, 0, 'COMMA', 0, 'COMMA')} + ' VND'"></td>
                    <td th:text="${#numbers.formatDecimal(o.totalPrice, 0, 'COMMA', 0, 'COMMA')} + ' VND'"></td>
                    <td th:text="${#temporals.format(o.createAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${o.status}"></td>
                </tr>
                </tbody>
            </table>

            <!-- PAGINATION -->
            <nav th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/seller/orders(page=${currentPage - 1})}">Previous</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{/seller/orders(page=${i})}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/seller/orders(page=${currentPage + 1})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</th:block>
</html>
