<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi"
      th:replace="~{base :: layout(~{::content}, ~{::cssFragment}, ~{::jsFragment})}">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa thông tin cửa hàng</title>

    <th:block th:fragment="cssFragment">
        <link rel="stylesheet" th:href="@{/css/shop-edit.css}">
    </th:block>
</head>

<th:block th:fragment="content">
    <div class="container mt-5">
        <div class="card shadow border-0">
            <div class="card-header text-white" style="background-color:rgb(25 135 84)">
                <h4 class="mb-0"><i class="fas fa-edit"></i> Chỉnh sửa thông tin cửa hàng</h4>
            </div>

            <div class="card-body">
                <div th:if="${errorMsg}" class="alert alert-danger text-center" th:text="${errorMsg}"></div>
                <form th:action="@{/seller/shop/update}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="shopName" class="form-label">Tên cửa hàng</label>
                        <input type="text" id="shopName" name="name" class="form-control"
                               th:value="${shop.name}" required>
                    </div>

                    <div class="mb-3">
                        <label for="shopDescription" class="form-label">Mô tả</label>
                        <textarea id="shopDescription" name="description" class="form-control" rows="4"
                                  th:text="${shop.description}"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Ảnh cửa hàng</label>
                        <div>
                            <img th:src="${shop.shopImageUrl}" id="previewImage"
                                 alt="Ảnh cửa hàng" class="rounded"
                                 style="max-height:180px; display:block;">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="shopImage" class="form-label">Ảnh cửa hàng mới (tùy chọn)</label>
                        <input type="file" id="shopImage" name="imageFile" class="form-control" accept="image/*">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/seller/statistic}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Quay lại
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="jsFragment">
    <script src="/javascript/seller/edit-shop.js"></script>
</th:block>
</html>
