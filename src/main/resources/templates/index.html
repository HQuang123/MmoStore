<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}">

<th:block th:fragment="cssFragment">
    <link rel="stylesheet" th:href="@{/css/homepage.css}">
    <!--    <link rel="stylesheet" th:href="@{/css/homepage.css}">-->
</th:block>

<th:block th:fragment="jsFragment">
    <script src="/javascript/homepage.js"></script>
</th:block>

<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section>
    <!-- Start Carousel -->

    <div id="carouselExample" class="carousel slide">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img height="550px" src="/images/banner4.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img style="height:550px;" src="/images/banner5.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img style="height:550px;" src="/images/banner6.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img style="height:550px;" src="/images/banner1.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img style="height:550px;" src="/images/banner2.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img style="height:550px;" src="/images/banner3.jpg" class="d-block w-100" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button"
                data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button"
                data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <!-- End of Carousel -->

    <div class="container">
        <div class="row">
            <div class="col-12">
                <p class="text-center fs-4 mt-5 mb-5">Danh mục</p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-2" th:each="category: ${latestSixActiveCategory}">
                <a th:href="@{'/productList'(category=${category.categoryId})}" style="text-decoration: none; color: inherit;">
                    <div class="text-center mb-5 category-card">

                        <img class="category-icon" alt="cataImg" th:src="${category.getCategoryImageUrl()}">

                        <div class="category-title">
                            <p class="mt-2"><b th:text="${category.name}">[[${category.categoryName}]]</b></p>
                        </div>
                    </div>
                </a>
            </div>

        </div>
    </div>

    <!-- Latest Product for Clothing Store -->

    <div class="container-fluid bg-light p-3">
        <div class="section-header">
            <h2>Sản phẩm mới</h2>
            <a href="#" th:href="@{/productList}">Xem tất cả sản phẩm</a>
        </div>

        <div class="row">
            <div class="col-md-2 mb-5" th:each="product: ${twelveLastestProducts}">

                <div class="card shadow-sm p-3 bg-white rounded h-100">

                    <div class="card-body text-center product d-flex flex-column h-100"
                         th:name="'product-' + ${product.getProductId()}"
                         th:onclick="'window.location.href=\'/product/' + ${product.productId} + '\''"
                         style="cursor: pointer;">

                        <div class="product-card-img-container">
                            <img class="product-card-img" alt="productImg" th:src="${product.getProductImageUrl()}">
                        </div>

                        <p class="text-center"><b th:text="${product.getTitle()}"></b></p>

                        <div class="mt-auto"
                             style="text-align: left"
                             th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', (product.price % 1 == 0) ? 0 : 2, 'POINT')} + 'đ'">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="register-section">
        <th:block th:if="${currentLoggedInUserDetails != null}">
            <div th:if="${!(currentLoggedInUserDetails.role.contains('ROLE_SELLER') || currentLoggedInUserDetails.role.contains('ROLE_ADMIN'))}">
                <h2>Đăng ký bán hàng</h2>
                <p>
                    Tạo một gian hàng của bạn trên trang của chúng tôi.
                    Đội ngũ hỗ trợ sẽ liên lạc để giúp bạn tối ưu khả năng bán hàng.
                </p>
                <a href="/user/seller_register" class="shop-register btn btn-primary">ĐĂNG KÝ</a>
            </div>
        </th:block>
    </div>
</section>
</body>
</html>
