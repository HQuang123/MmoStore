<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}">
<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>


    <th:block th:fragment="cssFragment">
        <link rel="stylesheet" href="#">
    </th:block>

    <th:block th:fragment="jsFragment">
        <script src="https://www.google.com/recaptcha/api.js" async defer></script>
        <script type="text/javascript">
            function onRecaptchaSuccess(token) {
                const loginButton = document.getElementById('loginBtn');
                loginButton.disabled = false;
            }

            // This function is called when the reCAPTCHA token expires
            function onRecaptchaExpired() {
                // Find the button
                const loginButton = document.getElementById('loginBtn');
                // Disable the button again
                loginButton.disabled = true;
            }

            // This function is called if the reCAPTCHA fails to load
            function onRecaptchaError() {
                console.error("reCAPTCHA failed to load.");
                // Ensure the button remains disabled
                const loginButton = document.getElementById('loginBtn');
                loginButton.disabled = true;
            }
        </script>
    </th:block>
</head>
<body>
<section>
    <div class="container mt-5 p-5">
        <div class="row">
            <div class="col-md-6 p-5">
                <img alt="" th:src="@{images/login.jpg}" width="100%" height="100%">
            </div>
            <div class="col-md-6 mt-3 p-5">
                <div class="card shadow p-3 mb-5 bg-body rounded">
                    <div class="card-header">
                        <p class="fs-4 text-center">Đăng nhập</p>
                        <div th:if="${param.logoutMessage}" class="alert alert-success text-center"> Bạn đã đăng xuất thành công!</div>
                        <!-- Logout and Signin Error Alert -->
                        <div th:if="${param.error}" class="alert alert-danger text-center">[[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]</div>
                        <div th:if="${param.logout}" class="alert alert-success text-center">Logout Successfully.</div>
                        <div th:if="${successMsg}" class="alert alert-success text-center" th:text="${successMsg}"></div>
                        <div th:if="${errorMsg}" class="alert alert-danger text-center" th:text="${errorMsg}"></div>
                        <div th:if="${param.success}" class="alert alert-success text-center">
                            Password reset success !
                        </div>
                        <!-- Logout and Signin Error Alert -->

                    </div>
                    <div class="card-body">
                        <form action="/login-process" method="post">
                            <div class="mb-3">
                                <label class="form-label">Email</label> <input
                                    class="form-control" name="username" type="email" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Mật khẩu</label> <input
                                    class="form-control" name="password" type="password" />
                            </div>
                            <div class="g-recaptcha mt-3"
                                 data-sitekey="6LfbQfsrAAAAACD8QBG7-VdRtXXMWIuV6C7uZzoU"
                                 data-callback="onRecaptchaSuccess"
                                 data-expired-callback="onRecaptchaExpired"
                                 data-error-callback="onRecaptchaError">
                            </div>
                            <button id="loginBtn" type="submit" class="btn bg-danger text-white col-md-12" disabled>Đăng nhập</button>
                        </form>
                        <div class="text-center mt-3">
                            <a class="btn btn-outline-primary col-md-12" href="/oauth2/authorization/google">Đăng nhập với Gmail</a>
                        </div>

                    </div>
                    <div class="card-footer text-center">
                        <a href="/forgot-password" class="text-decoration-none">Forgot Password ?</a><br>Không có tài khoản
                        <a href="/register" class="text-decoration-none"> Tạo mới</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
