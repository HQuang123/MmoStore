<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <th:block th:fragment="cssFragment">
        <link rel="stylesheet" href="/css/admin-dashboard.css">
    </th:block>

    <th:block th:fragment="jsFragment">
        <script src=""></script>
    </th:block>
</head>
<body>
<section>
    <div class="container text-center mt-5">
        <h2 class="mb-4 fw-semibold">Admin Dashboard</h2>

        <div class="row justify-content-center g-4">
            <!-- View User List -->
            <div class="col-md-6 col-sm-6">
                <a th:href="@{/admin/users}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 p-4 dashboard-card">
                        <div class="text-primary fs-1 mb-2">
                            <i class="bi bi-people-fill"></i>
                        </div>
                        <h5 class="fw-semibold text-dark">Quản lý người dùng</h5>
                    </div>
                </a>
            </div>

            <!-- View Shop List -->
            <div class="col-md-6 col-sm-6">
                <a th:href="@{/admin/shops}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 p-4 dashboard-card">
                        <div class="text-primary fs-1 mb-2">
                            <i class="bi bi-shop"></i>
                        </div>
                        <h5 class="fw-semibold text-dark">Quản lý của hàng</h5>
                    </div>
                </a>
            </div>

            <!-- Manage Category -->
            <div class="col-md-6 col-sm-6">
                <a th:href="@{/admin/categories}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 p-4 dashboard-card">
                        <div class="text-primary fs-1 mb-2">
                            <i class="bi bi-layers-fill"></i>
                        </div>
                        <h5 class="fw-semibold text-dark">Quản lý danh mục</h5>
                    </div>
                </a>
            </div>

            <!-- View User Deposit Request -->
            <div class="col-md-6 col-sm-6">
                <a th:href="@{/admin/withdraw}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 p-4 dashboard-card">
                        <div class="text-primary fs-1 mb-2">
                            <i class="bi bi-layers-fill"></i>
                        </div>
                        <h5 class="fw-semibold text-dark">Quản lý yêu cầu rút tiền</h5>
                    </div>
                </a>
            </div>
            <!-- Manage Blog -->
            <div class="col-md-6 col-sm-6">
                <a th:href="@{/admin/blog/management-post}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 p-4 dashboard-card">
                        <div class="text-primary fs-1 mb-2">
                            <i class="bi bi-journal-text"></i>
                        </div>
                        <h5 class="fw-semibold text-dark">Quản lý Blog</h5>
                    </div>
                </a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
