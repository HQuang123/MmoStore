<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}">

<head>
    <title th:text="${isEdit} ? 'Edit Category' : 'Add Category'"></title>

    <th:block th:fragment="cssFragment">
        <link rel="stylesheet" href="">
    </th:block>

    <th:block th:fragment="jsFragment">
        <script src="#"></script>
    </th:block>
</head>

<body>
<section class="container mt-4">
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>Error:</strong> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <h2 th:text="${isEdit} ? 'Edit Category' : 'Add Category'"></h2>

    <form th:action="${isEdit} ? @{'/admin/categories/edit/' + ${category.categoryId}} : @{/admin/categories/add}"
          th:object="${category}"
          method="post"
          enctype="multipart/form-data"
          class="mt-3">

        <div class="mb-3">
            <label for="imageFile" class="form-label">Category Image</label>
            <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*">
        </div>

        <!-- Preview existing image -->
        <div th:if="${category.categoryImageUrl}">
            <img th:src="${category.categoryImageUrl}" alt="Preview"
                 width="100" height="100" class="border rounded mt-2">
        </div>

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Update' : 'Add'"></button>
        </div>
    </form>

</section>
</body>
</html>
