<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}">

<head>
    <title>Category Management</title>

    <th:block th:fragment="cssFragment">
        <link rel="stylesheet" href="">
    </th:block>

    <th:block th:fragment="jsFragment">
        <script src="#"></script>
    </th:block>
</head>

<body>
<section class="container mt-4">
    <div class="mb-3">
        <a th:href="@{/admin}" class="btn btn-outline-primary btn-sm">
            ← Quay lại
        </a>
    </div>

    <h2 class="mb-4">Quản lý danh mục</h2>

    <!-- Filter + Search -->
    <form method="get" class="d-flex gap-2 mb-3">
        <select name="status" class="form-select form-select-sm w-auto">
            <option value="" th:selected="${status == null || status == ''}">Tất cả</option>
            <option th:value="active" th:selected="${status == 'active'}">Active</option>
            <option th:value="inactive" th:selected="${status == 'inactive'}">Inactive</option>
        </select>

        <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm"
               class="form-control form-control-sm w-auto">

        <button type="submit" class="btn btn-primary btn-sm">Tìm</button>

        <!-- Clear Filters -->
        <a th:href="@{/admin/categories}" class="btn btn-outline-secondary btn-sm">Xóa</a>
    </form>

    <!-- 📋 Category Table -->
    <div th:if="${#lists.isEmpty(categories)}" class="alert alert-warning">
        No categories found.
    </div>

    <!-- Add Category Button -->
    <div class="mb-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Categories</h5>
        <a th:href="@{/admin/categories/add}" class="btn btn-success btn-sm">
            + Thêm danh mục
        </a>
    </div>

    <table class="table table-bordered table-hover" th:if="${!#lists.isEmpty(categories)}">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Ảnh</th>
            <th>Tên</th>
            <th>Mô Tả</th>
            <th>Trạng Thái</th>
            <th>Hành Động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="category : ${categories}">
            <td th:text="${category.categoryId}"></td>

            <!-- 🖼️ Category Image -->
            <td>
                <img th:src="${category.categoryImageUrl != null ? category.categoryImageUrl : '/images/no-image.png'}"
                     alt="Category Image" width="60" height="60" class="rounded border">
            </td>

            <td th:text="${category.name}"></td>
            <td th:text="${category.description}"></td>
            <td>
            <span th:text="${category.isDeleted} ? 'Inactive' : 'Active'"
                  th:classappend="${category.isDeleted} ? 'text-danger' : 'text-success'"></span>
            </td>
            <td>
                <div class="btn-group" role="group">
                    <a th:href="@{'/admin/categories/edit/' + ${category.categoryId}}"
                       class="btn btn-info btn-sm">
                        <i class="bi bi-pencil-square"></i> Edit
                    </a>

                    <form th:action="@{'/admin/categories/' + ${category.categoryId} + '/toggle-status'}"
                          method="post" style="display:inline;">
                        <input type="hidden" name="page" th:value="${currentPage}">
                        <button type="submit"
                                class="btn btn-sm"
                                th:classappend="${category.isDeleted} ? 'btn-success' : 'btn-danger'">
                            <span th:text="${category.isDeleted} ? 'Activate' : 'Deactivate'"></span>
                        </button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <div th:if="${totalPages > 0}"
         class="d-flex justify-content-center align-items-center mt-3 gap-2">

        <!-- Previous button -->
        <a th:if="${hasPrevious}"
           th:href="@{/admin/categories(page=${currentPage - 1}, keyword=${keyword}, status=${status})}"
           class="btn btn-outline-primary btn-sm">Trước</a>

        <!-- Page numbers -->
        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
        <a th:if="${i != currentPage}"
           th:href="@{/admin/categories(page=${i}, keyword=${keyword}, status=${status})}"
           th:text="${i + 1}"
           class="btn btn-outline-secondary btn-sm mx-1"></a>

        <span th:if="${i == currentPage}"
              th:text="${i + 1}"
              class="btn btn-primary btn-sm mx-1 disabled">
        </span>
    </span>

        <!-- Next button -->
        <a th:if="${hasNext}"
           th:href="@{/admin/categories(page=${currentPage + 1}, keyword=${keyword}, status=${status})}"
           class="btn btn-outline-primary btn-sm">Tiếp</a>
    </div>

</section>
</body>
</html>
