<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <th:block th:fragment="cssFragment">
        <link rel="stylesheet" href="#">
    </th:block>

    <th:block th:fragment="jsFragment">
        <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    </th:block>
</head>
<body>
<section>
    <div class="container mt-5 p-5">
        <div class="row">
            <div class="col-md-5 p-5">
                <img alt="" th:src="@{images/login.jpg}" width="100%" height="400px">
            </div>
            <div class="col-md-7 mt-3 p-5">
                <div class="card shadow p-3 mb-5 bg-body rounded">
                    <div class="card-header">
                        <p class="fs-4 text-center">Register</p>

                        <th:block th:if="${successMsg}">
                            <p class="text-success fw-bold text-center mt-2" th:text="${successMsg}"></p>
                        </th:block>
                        <th:block th:if="${errorMsg}">
                            <p class="text-danger fw-bold text-center mt-2" th:text="${errorMsg}"></p>
                        </th:block>

                    </div>
                    <div class="card-body">
                        <form id="registerForm" th:action="@{/save-user}" th:object="${user}" method="post" enctype="multipart/form-data">

                            <div class="row">
                                <div class="col">
                                    <label class="form-label">Tên</label>
                                    <input class="form-control" th:field="*{name}" type="text"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" />
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}">
                                        <span th:errors="*{name}"></span>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="form-label">Số điện thoại</label>
                                    <input class="form-control" th:field="*{phoneNumber}" type="text"
                                           th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''" />
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}">
                                        <span th:errors="*{phoneNumber}"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="col">
                                <label class="form-label">Email</label>
                                <input class="form-control" th:field="*{email}" type="email"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" />
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}">
                                    <span th:errors="*{email}"></span>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col">
                                    <label class="form-label">Mật khẩu</label>
                                    <input class="form-control" th:field="*{password}" type="password"
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" />
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}">
                                        <span th:errors="*{password}"></span>
                                    </div>
                                </div>
                                <div class="col">
                                    <label class="form-label">Nhập lại mật khẩu</label>
                                    <input class="form-control" name="confirmPassword" type="password" />
                                    <div id="confirmPasswordHelp" class="form-text text-danger" style="display:none;">Mật khẩu không khớp.</div>
                                </div>
                            </div>

                            <div class="col">
                                <label class="form-label">Ảnh cá nhân</label>
                                <input id="fileInput" class="form-control" name="file" type="file" accept="image/*" />
                            </div>

                            <div class="text-center mt-3">
                                <img id="imagePreview" src="#" alt="Xem trước ảnh"
                                     style="display: none; width: 150px; height: 150px; object-fit: contain; border-radius: 0%; border: 1px solid #ccc;" />
                            </div>
                            <div class="g-recaptcha mt-3"
                                 data-sitekey="6LfbQfsrAAAAACD8QBG7-VdRtXXMWIuV6C7uZzoU">
                            </div>

                            <button id="submitBtn" type="submit" class="btn bg-danger mt-3 text-white col-md-12" disabled>Đăng ký</button>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <br>Đã có tài khoản ?
                        <a th:href="@{/login}" class="text-decoration-none"> Đăng nhập</a> <br>
                        <a th:href="@{/resend-verification}" class="text-decoration-none">Gửi lại mã xác nhận ?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var form = document.getElementById('registerForm');
            if (!form) return;
            var passwordInput = form.querySelector('input[name="password"]');
            var confirmInput = form.querySelector('input[name="confirmPassword"]');
            var help = document.getElementById('confirmPasswordHelp');
            var submitBtn = document.getElementById('submitBtn');

            // === START: NEW CODE FOR IMAGE PREVIEW ===
            var fileInput = document.getElementById('fileInput');
            var imagePreview = document.getElementById('imagePreview');

            if (fileInput && imagePreview) {
                fileInput.addEventListener('change', function() {
                    var file = this.files[0];
                    if (file) {
                        // Check if the file is an image
                        if (file.type.startsWith('image/')) {
                            var reader = new FileReader();
                            reader.onload = function(e) {
                                imagePreview.src = e.target.result;
                                imagePreview.style.display = 'block'; // Show the image
                            }
                            reader.readAsDataURL(file);
                        } else {
                            // Not an image file
                            alert('Vui lòng chọn một tệp hình ảnh.');
                            fileInput.value = ''; // Reset the input
                            imagePreview.src = '#';
                            imagePreview.style.display = 'none';
                        }
                    } else {
                        // No file selected (e.g., user hit cancel)
                        imagePreview.src = '#';
                        imagePreview.style.display = 'none';
                    }
                });
            }
            // === END: NEW CODE FOR IMAGE PREVIEW ===


            function validatePasswords() {
                var pass = passwordInput ? passwordInput.value : '';
                var confirm = confirmInput ? confirmInput.value : '';
                var matched = confirm.length > 0 && pass === confirm;

                if (matched) {
                    if (confirmInput) confirmInput.setCustomValidity('');
                    if (help) { help.style.display = 'none'; help.textContent = ''; }
                } else {
                    if (confirmInput) confirmInput.setCustomValidity('Passwords do not match');
                    if (help) { help.style.display = confirm.length ? 'block' : 'none';
                        help.textContent = 'Mật khẩu không khớp.';
                        help.style.color = 'red';}
                }

                if (submitBtn) submitBtn.disabled = !matched;
            }

            if (passwordInput) passwordInput.addEventListener('input', validatePasswords);
            if (confirmInput) confirmInput.addEventListener('input', validatePasswords);

            if (form) {
                form.addEventListener('submit', function (e) {
                    validatePasswords();
                    var recaptchaResponse = grecaptcha.getResponse();
                    if (recaptchaResponse.length === 0) {
                        e.preventDefault(); // Stop the form submission

                        var errorP = document.querySelector('p[th\\:if="${errorMsg}"]');
                        if(errorP) {
                            errorP.textContent = 'Please verify you are not a robot.';
                            errorP.className = 'text-danger fw-bold text-center mt-2';
                        } else {
                            alert('Please verify you are not a robot.');
                        }
                        return; // Stop here
                    }
                    if (!form.checkValidity()) {
                        e.preventDefault();
                        if (confirmInput) confirmInput.reportValidity();
                    }
                });
            }

            // Initialize UI state on load
            validatePasswords();
        });
    </script>
</section>
</body>
</html>
