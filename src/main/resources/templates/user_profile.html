<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section}, ~{::#css}, ~{::#js})}">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ người dùng</title>
    <th:block id="css"></th:block>
</head>
<body>
<section>
    <!-- Hiển thị thông báo lỗi -->
    <div th:if="${errorMsg}"
         class="alert alert-danger text-center"
         th:text="${errorMsg}">
    </div>

    <!-- Hiển thị thông báo thành công -->
    <div th:if="${successMsg}"
         class="alert alert-success text-center"
         th:text="${successMsg}">
    </div>
    <div class="mb-3">
        <a th:href="@{/}" class="btn btn-outline-primary btn-sm">
            ← Quay lại trang chủ
        </a>
    </div>

    <div class="container mt-5 p-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow p-4 mb-5 bg-body rounded">
                    <div class="card-header text-center bg-primary text-white">
                        <h4>Hồ sơ người dùng</h4>
                    </div>

                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-4 text-center">
                                <img th:src="${user.profileImage}"
                                     alt="Ảnh đại diện người dùng"
                                     style="width:150px; height:150px; border-radius:50%; object-fit:cover;">
                                <a href="#" class="btn btn-primary ms-2" data-bs-toggle="modal"
                                   data-bs-target="#editImageModal">
                                    Chỉnh sửa ảnh
                                </a>
                            </div>

                            <div class="col-md-8">
                                <p><strong>ID người dùng:</strong> <span th:text="${user.userId}"></span></p>
                                <p><strong>Họ tên:</strong> <span th:text="${user.name}"></span></p>
                                <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
                                <p><strong>Số điện thoại:</strong> <span th:text="${user.phoneNumber}"></span></p>
                                <p><strong>Vai trò:</strong>
                                    <span th:text="${#strings.replace(user.role, 'ROLE_', '')}"></span>
                                </p>
                                <p><strong>Ngày tạo:</strong> <span th:text="${user.createdAt}"></span></p>
                                <p>
                                    <strong>Số dư:</strong>
                                    <span th:text="${#numbers.formatDecimal(user.balance, 0, 'POINT', 0, 'POINT')}"></span> VNĐ
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer text-center">
                        <a href="/user/edit" class="btn btn-primary ms-2">Chỉnh sửa hồ sơ</a>
                        <button type="button" class="btn btn-warning ms-2" data-bs-toggle="modal"
                                data-bs-target="#resetPasswordModal">
                            Đổi mật khẩu
                        </button>
                        <a href="/user/delete" class="btn btn-danger ms-2">Xóa tài khoản</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Upload Ảnh -->
    <div class="modal fade" id="editImageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog" style="padding-top: 285px;">
            <div class="modal-content">
                <form th:action="@{/user/editimage}" method="post" enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title">Cập nhật ảnh đại diện</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="imageFile" class="form-label">Chọn ảnh mới:</label>
                            <input type="file" name="imageFile" id="imageFile" class="form-control" accept="image/*" required>
                        </div>

                        <!-- Xem trước ảnh -->
                        <div class="text-center mt-3" style="padding-left: 160px;">
                            <img id="previewImage" src="#" alt="Xem trước"
                                 style="display:none; width:150px; height:150px; border-radius:50%; object-fit:cover;">
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success">Tải lên</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Đổi mật khẩu -->
    <div class="modal fade" id="resetPasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog" style="padding-top: 190px;">
            <div class="modal-content">
                <form th:action="@{/user/reset-password}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Đổi mật khẩu</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="oldPassword" class="form-label">Mật khẩu hiện tại:</label>
                            <input type="password" id="oldPassword" name="oldPassword" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Mật khẩu mới:</label>
                            <input type="password" id="newPassword" name="newPassword" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới:</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success">Cập nhật</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</section>
<th:block id="js">
    <script src="/javascript/profile.js"></script>
</th:block>
</body>
</html>
