<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section}, ~{::#css}, ~{::#js})}">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <th:block id="css"></th:block>
</head>
<body>
<section>
    <div th:if="${successMsg}"
         class="alert alert-success text-center"
         th:text="${successMsg}">
    </div>


    <div class="container mt-5 p-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow p-4 mb-5 bg-body rounded">
                    <div class="card-header text-center bg-primary text-white">
                        <h4>User Profile</h4>
                    </div>

                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-4 text-center">
<!--                                <img th:if="${blobName != null}"-->
<!--                                     th:src="@{/user/image(blobName=${blobName})}"-->
                                <img th:src="${user.profileImage}"
                                     alt="User Profile Image"
                                     style="width:150px; height:150px; border-radius:50%; object-fit:cover;">
                                <a href="#" class="btn btn-primary ms-2" data-bs-toggle="modal" data-bs-target="#editImageModal">
                                    Edit Image
                                </a>
                            </div>

                            <div class="col-md-8">
                                <p><strong>User ID:</strong> <span th:text="${user.userId}"></span></p>
                                <p><strong>Name:</strong> <span th:text="${user.name}"></span></p>
                                <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
                                <p><strong>Phone Number:</strong> <span th:text="${user.phoneNumber}"></span></p>
                                <p><strong>Role:</strong> <span th:text="${user.role}"></span></p>
                                <p><strong>Create At:</strong> <span th:text="${user.createdAt}"></span></p>
                                <p><strong>Balance:</strong> <span th:text="${user.balance}"></span></p>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer text-center">
                        <a href="/user/edit" class="btn btn-primary ms-2">Edit Profile</a>
                        <a href="#" class="btn btn-danger ms-2">DELETE</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 🟢 Modal Upload Ảnh -->
    <div class="modal fade" id="editImageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/user/editimage}" method="post" enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title">Cập nhật ảnh đại diện</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="imageFile" class="form-label">Chọn ảnh mới:</label>
                            <input type="file" name="imageFile" id="imageFile" class="form-control" accept="image/*"
                                   required>
                        </div>

                        <!-- Xem trước ảnh -->
                        <div class="text-center">
                            <img id="previewImage" src="#" alt="Preview"
                                 style="display:none; width:150px; height:150px; border-radius:50%; object-fit:cover;">
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success">Upload</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
<th:block id="js"></th:block>
</body>
</html>
