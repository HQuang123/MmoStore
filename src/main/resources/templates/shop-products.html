<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section}, ~{::cssFragment}, ~{::jsFragment})}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="'Products from ' + ${shop.name}">Shop Products</title>
    <th:block th:fragment="cssFragment">
        <link rel="stylesheet" href="/css/shop-information.css">
    </th:block>

    <th:block th:fragment="jsFragment">
        <script src="#"></script>
    </th:block>

</head>
<body>
<section>

    <div class="container my-5">

        <div th:if="${shop}">
            <h1 class="display-5" th:text="'Products from ' + ${shop.name}">Shop Name</h1>
            <p>
                <a th:href="@{/shops/{id}(id=${shop.shopId})}" class="btn btn-sm btn-outline-secondary">
                    &larr; Back to Shop Profile
                </a>
            </p>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mt-3">

            <div class="col" th:each="product : ${productPage.content}">
                <div class="card product-card shadow-sm">
                    <div class="card-img-top bg-secondary text-white text-center p-5">
                        <span>Product Image</span>
                    </div>

                    <div class="card-body">
                        <h5 class="card-title">
                            <a th:href="@{/product/{id}(id=${product.id})}"
                               th:text="${product.title}" class="text-decoration-none">
                                Product Title
                            </a>
                        </h5>

                        <p class="card-text text-muted"
                           th:text="${#strings.abbreviate(product.description, 100)}">
                            Short product description...
                        </p>

                        <div>
                <span th:if="${product.avgRating > 0}">
                    <span class="rating-star">★</span>
                    <strong th:text="${#numbers.formatDecimal(product.avgRating, 1, 1)}">4.5</strong>
                </span>
                            <span th:unless="${product.avgRating > 0}" class="text-muted">
                    No ratings
                </span>
                        </div>
                    </div>

                    <div class="card-footer d-flex justify-content-between align-items-center">
            <span class="fs-5 fw-bold text-success"
                  th:text="'$' + ${#numbers.formatDecimal(product.price, 0, 2)}">
                $99.99
            </span>
                        <a th:href="@{/product/{id}(id=${product.id})}"
                           class="btn btn-sm btn-outline-primary">
                            View Details
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-12" th:if="${productPage.empty}">
                <div class="alert alert-info" role="alert">
                    This shop doesn't have any products listed yet.
                </div>
            </div>
        </div>

        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center mt-4">
                <li class="page-item" th:classappend="${productPage.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/shops/{id}/products(id=${shop.shopId}, page=${currentPage > 0 ? currentPage - 1 : 0})}">
                        Previous
                    </a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link"
                       th:href="@{/shops/{id}/products(id=${shop.shopId}, page=${i})}"
                       th:text="${i + 1}"></a>
                </li>

                <li class="page-item" th:classappend="${productPage.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/shops/{id}/products(id=${shop.shopId}, page=${currentPage + 1})}">
                        Next
                    </a>
                </li>
            </ul>
        </nav>

    </div>
</section>
</body>
</html>
